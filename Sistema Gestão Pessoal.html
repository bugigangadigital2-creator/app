              <div class="font-semibold">Tarefas do dia</div>
              <div class="mt-2 space-y-2">
                ${tasks.length ? tasks.map(taskRowMini).join('') : '<div class="text-sm text-slate-600 dark:text-slate-300">Sem tarefas.</div>'}

            </div>
            <div>

    function evListRow(ev) {
      return `

          <div class="min-w-0">
            <div class="font-semibold truncate">${escapeHtml(ev.title)}</div>
            <div class="text-xs text-slate-500 dark:text-slate-400">${fmt.datetimeHuman(ev.startAt)}${ev.location ? ' • ' + escapeHtml(ev.location) : ''}${ev.reminderMin ? ' • 🔔 ' + ev.reminderMin + 'm' : ''}</div>

    function calendarIntegrationCard() {
      const today = fmt.dateISO(new Date());
      const tasksToday = state.data.tasks.filter(t => t.dueDate === today && t.status !== 'done').length;
      const eventsToday = state.data.events.filter(e => fmt.dateISO(e.startAt) === today).length;
      const habitsDoneToday = state.data.habits.reduce((s,h)=> s + ((h.history||[]).includes(today) ? 1 : 0), 0);
      return `
        <div class="rounded-3xl soft-border bg-white/30 dark:bg-slate-950/20 p-4">

            ${miniStat('Tarefas', tasksToday)}
            ${miniStat('Hábitos', habitsDoneToday)}

        </div>

    function bindCalendar() {

      $$('.calView').forEach(b => b.addEventListener('click', () => {
        state.data.ui.calendarView = b.dataset.view;
        saveDataFor(state.user.id, state.data);
        renderView();
      }));

      $('#btnCalPrev')?.addEventListener('click', () => {
        const v = state.data.ui.calendarView || 'mês';
        if (v === 'mês') {
          const d = new Date(state.calendar.focusMonth); d.setMonth(d.getMonth()-1); state.calendar.focusMonth = d;
        }
        renderView();
      });
      $('#btnCalNext')?.addEventListener('click', () => {
        const v = state.data.ui.calendarView || 'mês';
        if (v === 'mês') {
          const d = new Date(state.calendar.focusMonth); d.setMonth(d.getMonth()+1); state.calendar.focusMonth = d;
        }
        renderView();
      });
      $('#btnCalToday')?.addEventListener('click', () => {
        state.calendar.focusMonth = new Date();
        renderView();
      });

      $$('.btnMonthDay').forEach(b => b.addEventListener('click', () => openEventModal(null, b.dataset.day)));
      $$('.btnAddEventDay').forEach(b => b.addEventListener('click', () => openEventModal(null, b.dataset.day)));

    function openEventModal(eventId=null, prefillDayIso=null) {
      const ev = eventId ? state.data.events.find(x => x.id === eventId) : null;
      const isEdit = !!ev;

      const baseStart = ev?.startAt ? new Date(ev.startAt) : (() => {
        const d = prefillDayIso ? new Date(prefillDayIso) : new Date();
        d.setHours(9,0,0,0);
        return d;
      })();
      const baseEnd = ev?.endAt ? new Date(ev.endAt) : new Date(baseStart.getTime() + 45*60000);

      const startVal = baseStart.toISOString().slice(0,16);
      const endVal = baseEnd.toISOString().slice(0,16);

      openModal({
        title: isEdit ? 'Editar evento' : 'Novo evento',
        primaryText: isEdit ? 'Salvar' : 'Criar',
        bodyHtml: `
          <form id="eventForm" class="grid gap-3">
            <label class="text-xs text-slate-600 dark:text-slate-300">Título
              <input name="title" required class="mt-1 w-full px-3 py-2 rounded-xl soft-border bg-transparent" value="${escapeAttr(ev?.title||'')}" placeholder="Ex: Reunião" />
            </label>

            <div class="grid md:grid-cols-2 gap-3">
              <label class="text-xs text-slate-600 dark:text-slate-300">Início
                <input name="start" type="datetime-local" class="mt-1 w-full px-3 py-2 rounded-xl soft-border bg-transparent" value="${escapeAttr(startVal)}" />
              </label>
              <label class="text-xs text-slate-600 dark:text-slate-300">Fim
                <input name="end" type="datetime-local" class="mt-1 w-full px-3 py-2 rounded-xl soft-border bg-transparent" value="${escapeAttr(endVal)}" />
              </label>
            </div>

            <div class="grid md:grid-cols-2 gap-3">
              <label class="text-xs text-slate-600 dark:text-slate-300">Local
                <input name="location" class="mt-1 w-full px-3 py-2 rounded-xl soft-border bg-transparent" value="${escapeAttr(ev?.location||'')}" placeholder="Opcional" />
              </label>
              <label class="text-xs text-slate-600 dark:text-slate-300">Lembrete
                <select name="reminder" class="mt-1 w-full px-3 py-2 rounded-xl soft-border bg-transparent">
                  ${[0,5,10,15,30,60].map(m => `<option value="${m}" ${Number(ev?.reminderMin||0)===m?'selected':''}>${m===0?'Sem lembrete':m+' min antes'}</option>`).join('')}
                </select>
              </label>
            </div>

            <label class="text-xs text-slate-600 dark:text-slate-300">Descrição
              <textarea name="desc" rows="3" class="mt-1 w-full px-3 py-2 rounded-xl soft-border bg-transparent" placeholder="Opcional">${escapeHtml(ev?.desc||'')}</textarea>
            </label>
          </form>
        `,
        onPrimary: (wrap) => {
          const form = $('#eventForm', wrap);
          const fd = new FormData(form);
          const title = (fd.get('title')||'').toString().trim();
          if (!title) { toast('Informe o título do evento.', 'warn'); return false; }

          const startAt = new Date(fd.get('start')).toISOString();
          const endAt = new Date(fd.get('end')).toISOString();
          const payload = {
            title,
            startAt,
            endAt,
            location: (fd.get('location')||'').toString().trim(),
            desc: (fd.get('desc')||'').toString().trim(),
            reminderMin: Number(fd.get('reminder')||0),
            updatedAt: nowISO()
          };

          if (isEdit) Object.assign(ev, payload);
          else state.data.events.push({ id: uid(), ...payload, createdAt: nowISO() });

          saveDataFor(state.user.id, state.data);
          scheduleReminders();
          toast(isEdit ? 'Evento atualizado.' : 'Evento criado.', 'ok');
          renderView();
        }
      });
    }

    async function deleteEvent(id) {
      const ev = state.data.events.find(x => x.id === id);
      if (!ev) return;
      const ok = await confirmModal({
        title: 'Excluir evento',
        message: `Excluir “<b>${escapeHtml(ev.title)}</b>”?`,
        danger: true,
        confirmText: 'Excluir'
      });
      if (!ok) return;
      state.data.events = state.data.events.filter(x => x.id !== id);
      saveDataFor(state.user.id, state.data);
      scheduleReminders();
      toast('Evento excluído.', 'ok');
      renderView();
    }

    const FIN_CATS = ['fixas','variáveis','lazer','alimentação','moradia','transporte','saúde','educação','assinaturas','outros','salário','freelance'];

    function renderFinance() {
      const monthKey = fmt.monthKey(new Date());
      const tx = [...state.data.transactions].sort((a,b)=> (b.date||'').localeCompare(a.date||''));

      const txMonth = tx.filter(t => fmt.monthKey(t.date) === monthKey);
      const income = txMonth.filter(t=>t.type==='income').reduce((s,t)=>s+Number(t.amount||0),0);
      const expense = txMonth.filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount||0),0);
      const saved = income - expense;
      const budget = Number(state.data.meta.budgetMonth || 0);
      const pct = budget ? clamp((expense/budget)*100,0,200) : 0;
      const alert = budget && expense > budget;

      return `
        <div class="space-y-4 md:space-y-6 fade-in">
          <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
            <div>
              <div class="text-sm text-slate-600 dark:text-slate-300">Receitas • despesas • alertas • gráficos</div>
              <div class="text-xl font-semibold">Controle Financeiro</div>
            </div>
            <div class="flex items-center gap-2">
              <button id="btnAddTx" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm inline-flex items-center gap-2">${Icons.plus('w-4 h-4')} Nova transação</button>
              <button id="btnBudget" class="px-3 py-2 rounded-xl soft-border hover:soft-bg text-sm">Orçamento</button>
            </div>
          </div>

          <div class="grid lg:grid-cols-4 gap-3">
            ${kpiMoney('Receitas (mês)', income, 'Entradas do mês')}
            ${kpiMoney('Gastos (mês)', expense, alert ? 'Acima do orçamento' : 'Dentro do previsto', alert ? 'warn' : 'ok')}
            ${kpiMoney('Economia (mês)', saved, saved >= 0 ? 'Saldo positivo' : 'Saldo negativo', saved >= 0 ? 'ok' : 'warn')}
            <div class="glass2 rounded-3xl p-4">
              <div class="text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400">Orçamento</div>
              <div class="mt-2 text-lg font-semibold">${fmt.money(budget)}</div>
              <div class="mt-2 w-full h-2 rounded-full bg-slate-200/60 dark:bg-slate-800/60 overflow-hidden">
                <div class="h-full ${alert ? 'bg-rose-600' : 'bg-amber-600'}" style="width:${clamp(pct,0,100)}%"></div>
              </div>
              <div class="mt-2 text-xs text-slate-600 dark:text-slate-300">Uso: ${Math.round(pct)}%</div>
            </div>

    function kpiMoney(title, amount, hint, kind='info') {
      const color = {
        info: 'text-slate-900 dark:text-slate-100',
        ok: 'text-emerald-700 dark:text-emerald-300',
        warn: 'text-amber-700 dark:text-amber-300'
      }[kind] || 'text-slate-900 dark:text-slate-100';
      return `
        <div class="glass2 rounded-3xl p-4">
          <div class="text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400">${title}</div>
          <div class="mt-2 text-lg font-semibold ${color}">${fmt.money(amount)}</div>
          <div class="mt-1 text-xs text-slate-600 dark:text-slate-300">${hint}</div>
        </div>
      `;
    }

    function txRow(t) {
      const isExp = t.type === 'expense';
      return `
        <tr class="border-t border-slate-200/50 dark:border-slate-700/40">
          <td class="py-3 text-slate-600 dark:text-slate-300">${fmt.dateHuman(t.date)}</td>
          <td class="py-3"><span class="text-[11px] px-2 py-1 rounded-full border ${isExp ? 'bg-rose-600/10 text-rose-700 dark:text-rose-300 border-rose-600/20' : 'bg-emerald-600/10 text-emerald-700 dark:text-emerald-300 border-emerald-600/20'}">${isExp ? 'despesa' : 'receita'}</span></td>
          <td class="py-3">${escapeHtml(t.category||'outros')}</td>
          <td class="py-3 text-slate-600 dark:text-slate-300">${escapeHtml(t.note||'—')}</td>
          <td class="py-3 text-right font-semibold ${isExp ? 'text-rose-700 dark:text-rose-300' : 'text-emerald-700 dark:text-emerald-300'}">${fmt.money(t.amount)}</td>
          <td class="py-3 text-right">
            <button class="btnEditTx px-3 py-2 rounded-xl soft-border hover:soft-bg text-xs" data-id="${t.id}">Editar</button>
            <button class="btnDelTx px-3 py-2 rounded-xl soft-border hover:soft-bg text-xs" data-id="${t.id}">Excluir</button>
          </td>
        </tr>
      `;
    }

    function bindFinance() {
      $('#btnAddTx')?.addEventListener('click', () => openTransactionModal());
      $('#btnBudget')?.addEventListener('click', () => openBudgetModal());
      $$('.btnEditTx').forEach(b => b.addEventListener('click', () => openTransactionModal(b.dataset.id)));
      $$('.btnDelTx').forEach(b => b.addEventListener('click', () => deleteTransaction(b.dataset.id)));
      renderFinanceCharts();
    }

    function renderFinanceCharts() {
      const isDark = document.documentElement.classList.contains('dark');
      const gridColor = isDark ? 'rgba(148,163,184,.18)' : 'rgba(15,23,42,.08)';
      const tickColor = isDark ? 'rgba(226,232,240,.75)' : 'rgba(30,41,59,.7)';

      const monthKey = fmt.monthKey(new Date());
      const txMonth = state.data.transactions.filter(tx => fmt.monthKey(tx.date) === monthKey);
      const expenses = txMonth.filter(t => t.type === 'expense');
      const byCat = {};
      expenses.forEach(t => { const c = t.category || 'outros'; byCat[c] = (byCat[c]||0) + Number(t.amount||0); });
      const labels = Object.keys(byCat);
      const vals = Object.values(byCat);
      const ctxPie = $('#chartFinancePie');
      if (ctxPie) {
        state.charts.financePie = new Chart(ctxPie, {
          type: 'pie',
          data: { labels, datasets: [{ data: vals, backgroundColor: palette(vals.length) }] },
          options: { plugins: { legend: { labels: { color: tickColor } } } }
        });
      }

      const months = [...Array(6)].map((_,i) => {
        const d = new Date();
        d.setMonth(d.getMonth() - (5-i));
        return fmt.monthKey(d);
      });
      const labels2 = months.map(m => {
        const [y,mm] = m.split('-');
        return `${mm}/${y.slice(2)}`;
      });
      const expByMonth = months.map(m => state.data.transactions.filter(t => t.type==='expense' && fmt.monthKey(t.date)===m).reduce((s,t)=>s+Number(t.amount||0),0));
      const incByMonth = months.map(m => state.data.transactions.filter(t => t.type==='income' && fmt.monthKey(t.date)===m).reduce((s,t)=>s+Number(t.amount||0),0));

      const ctxBars = $('#chartFinanceBars');
      if (ctxBars) {
        state.charts.financeBars = new Chart(ctxBars, {
          type: 'bar',
          data: {
            labels: labels2,
            datasets: [
              { label: 'Despesas', data: expByMonth, backgroundColor: 'rgba(244,63,94,.55)', borderRadius: 10 },
              { label: 'Receitas', data: incByMonth, backgroundColor: 'rgba(16,185,129,.55)', borderRadius: 10 }
            ]
          },
          options: {
            plugins: { legend: { labels: { color: tickColor } } },
            scales: {
              x: { grid: { display: false }, ticks: { color: tickColor } },
              y: { beginAtZero: true, grid: { color: gridColor }, ticks: { color: tickColor, callback: v => 'R$ ' + Number(v).toLocaleString('pt-BR') } }
            }
          }
        });
      }
    }

    function palette(n) {
      const base = [
        'rgba(99,102,241,.75)',
        'rgba(14,165,233,.75)',
        'rgba(16,185,129,.75)',
        'rgba(245,158,11,.75)',
        'rgba(168,85,247,.75)',
        'rgba(244,63,94,.75)',
        'rgba(100,116,139,.75)',
        'rgba(34,197,94,.75)',
        'rgba(59,130,246,.75)',
        'rgba(234,179,8,.75)'
      ];
      return [...Array(n)].map((_,i)=> base[i%base.length]);
    }

    function openBudgetModal() {
      const current = Number(state.data.meta.budgetMonth || 0);
      openModal({
        title: 'Orçamento mensal',
        primaryText: 'Salvar',
        bodyHtml: `
          <div class="grid gap-3">
            <label class="text-xs text-slate-600 dark:text-slate-300">Defina um teto para alertas
              <input id="budgetInput" type="number" min="0" step="0.01" class="mt-1 w-full px-3 py-2 rounded-xl soft-border bg-transparent" value="${escapeAttr(String(current))}" />
            </label>
            <div class="text-sm text-slate-600 dark:text-slate-300">Dica: use o módulo Finanças para acompanhar categorias e tendência.</div>
          </div>
        `,
        onPrimary: (wrap) => {
          const v = Number($('#budgetInput', wrap).value || 0);
          state.data.meta.budgetMonth = Math.max(0, v);
          saveDataFor(state.user.id, state.data);
          toast('Orçamento atualizado.', 'ok');
          renderView();
        }
      });
    }

    function openTransactionModal(txId=null) {
      const t = txId ? state.data.transactions.find(x => x.id === txId) : null;
      const isEdit = !!t;
      const date = t?.date || fmt.dateISO(new Date());

      openModal({
        title: isEdit ? 'Editar transação' : 'Nova transação',
        primaryText: isEdit ? 'Salvar' : 'Criar',
        bodyHtml: `
          <form id="txForm" class="grid gap-3">
            <div class="grid md:grid-cols-2 gap-3">
              <label class="text-xs text-slate-600 dark:text-slate-300">Tipo
                <select name="type" class="mt-1 w-full px-3 py-2 rounded-xl soft-border bg-transparent">
                  <option value="expense" ${t?.type==='expense'?'selected':''}>Despesa</option>
                  <option value="income" ${t?.type==='income'?'selected':''}>Receita</option>
                </select>
              </label>
              <label class="text-xs text-slate-600 dark:text-slate-300">Valor
                <input name="amount" type="number" min="0" step="0.01" required class="mt-1 w-full px-3 py-2 rounded-xl soft-border bg-transparent" value="${escapeAttr(String(t?.amount ?? ''))}" placeholder="0,00" />
              </label>
            </div>

            <div class="grid md:grid-cols-2 gap-3">
              <label class="text-xs text-slate-600 dark:text-slate-300">Categoria
                <select name="category" class="mt-1 w-full px-3 py-2 rounded-xl soft-border bg-transparent">
                  ${FIN_CATS.map(c => `<option ${t?.category===c?'selected':''} value="${c}">${c}</option>`).join('')}
                </select>
              </label>
              <label class="text-xs text-slate-600 dark:text-slate-300">Data
                <input name="date" type="date" class="mt-1 w-full px-3 py-2 rounded-xl soft-border bg-transparent" value="${escapeAttr(date)}" />
              </label>
            </div>

            <label class="text-xs text-slate-600 dark:text-slate-300">Nota
              <input name="note" class="mt-1 w-full px-3 py-2 rounded-xl soft-border bg-transparent" value="${escapeAttr(t?.note||'')}" placeholder="Opcional" />
            </label>
          </form>
        `,
        onPrimary: (wrap) => {
          const fd = new FormData($('#txForm', wrap));
          const amount = Number(fd.get('amount')||0);
          if (!(amount > 0)) { toast('Informe um valor maior que 0.', 'warn'); return false; }

          const payload = {
            type: fd.get('type')?.toString() || 'expense',
            amount,
            category: fd.get('category')?.toString() || 'outros',
            date: fd.get('date')?.toString() || fmt.dateISO(new Date()),
            note: fd.get('note')?.toString() || '',
          };

          if (isEdit) Object.assign(t, payload);
          else state.data.transactions.push({ id: uid(), ...payload, createdAt: nowISO() });

          saveDataFor(state.user.id, state.data);
          toast(isEdit ? 'Transação atualizada.' : 'Transação criada.', 'ok');
          renderView();
        }
      });
    }

    async function deleteTransaction(id) {
      const t = state.data.transactions.find(x => x.id === id);
      if (!t) return;
      const ok = await confirmModal({
        title: 'Excluir transação',
        message: `Excluir transação de <b>${fmt.money(t.amount)}</b> (${escapeHtml(t.category||'outros')})?`,
        danger: true,
        confirmText: 'Excluir'
      });
      if (!ok) return;
      state.data.transactions = state.data.transactions.filter(x => x.id !== id);
      saveDataFor(state.user.id, state.data);
      toast('Transação excluída.', 'ok');
      renderView();
    }

      const diary = [...state.data.diary]
        .filter(d => !q || `${d.date} ${stripHtml(d.contentHtml||'')}`.toLowerCase().includes(q))
        .sort((a,b)=> (b.date||'').localeCompare(a.date||''));

      return `
        <div class="space-y-4 md:space-y-6 fade-in">
          <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">

            </div>
          </div>

          <div class="glass2 rounded-3xl p-4 md:p-5">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
              <div>
                <div class="font-semibold">${tab==='diario' ? 'Entradas' : 'Notas'}</div>
                <div class="text-sm text-slate-600 dark:text-slate-300">Clique para abrir e editar</div>
              </div>
              <div class="flex items-center gap-2">
                <div class="flex items-center gap-2 px-3 py-2 rounded-xl soft-border bg-white/30 dark:bg-slate-950/20 text-sm">
                  <span class="opacity-70">${Icons.search('w-4 h-4')}</span>

                </div>
              </div>
            </div>

            <div class="mt-4 grid lg:grid-cols-3 gap-3">
              <div class="lg:col-span-1 rounded-3xl soft-border bg-white/25 dark:bg-slate-950/15 p-3 max-h-[64vh] overflow-auto mini-scroll">

          </div>
        </div>

      `;

    function bindNotes() {
      const ui = state.data.ui;

      $$('.notesTab').forEach(b => b.addEventListener('click', () => {
        ui.notesTab = b.dataset.tab;
        saveDataFor(state.user.id, state.data);
        renderView();
      }));

      $('#notesSearch')?.addEventListener('input', (e) => { state.search.notes = e.target.value; renderView(); });

      $('#btnAddNote')?.addEventListener('click', () => {
        if ((ui.notesTab||'notas') === 'diario') openDiaryModal();

        const n = state.data.notes.find(x => x.id === b.dataset.id);

        bindNotesPreview();
      }));

      $$('.btnOpenDiary').forEach(b => b.addEventListener('click', () => {
        const d = state.data.diary.find(x => x.id === b.dataset.id);
        $('#notesPreview').innerHTML = d ? diaryPreview(d) : emptyState('Não encontrado', '');
        bindNotesPreview();
      }));

      bindNotesPreview();
    }

    function renderHealthCharts() {
      const isDark = document.documentElement.classList.contains('dark');
      const gridColor = isDark ? 'rgba(148,163,184,.18)' : 'rgba(15,23,42,.08)';
      const tickColor = isDark ? 'rgba(226,232,240,.75)' : 'rgba(30,41,59,.7)';

      const logs = [...(state.data.health?.logs || [])].sort((a,b)=> (a.date||'').localeCompare(b.date||''));
      const last14 = logs.slice(-14);
      const labels = last14.map(l => l.date.slice(5));
      const water = last14.map(l => Number(l.waterMl||0));
      const sleep = last14.map(l => Number(l.sleepH||0));
      const weight = last14.map(l => Number(l.weightKg||0));
      const ex = last14.map(l => Number(l.exerciseMin||0));

      const ctx1 = $('#chartHealth');
      if (ctx1) {
        state.charts.health = new Chart(ctx1, {
          type: 'line',
          data: { labels, datasets: [
            { label:'Água (ml)', data: water, borderColor:'rgba(59,130,246,.85)', backgroundColor:'rgba(59,130,246,.15)', tension:.35, fill:true, pointRadius:2 },
            { label:'Sono (h)', data: sleep, borderColor:'rgba(168,85,247,.85)', backgroundColor:'rgba(168,85,247,.12)', tension:.35, fill:false, pointRadius:2 }
          ]},
          options: {
            plugins: { legend: { labels: { color: tickColor } } },
            scales: {
              x: { grid: { display:false }, ticks: { color: tickColor } },
              y: { beginAtZero:true, grid: { color: gridColor }, ticks: { color: tickColor } }
            }
          }
        });
      }

      const ctx2 = $('#chartHealth2');
      if (ctx2) {
        state.charts.health2 = new Chart(ctx2, {
          type: 'bar',
          data: { labels, datasets: [
            { label:'Exercício (min)', data: ex, backgroundColor:'rgba(16,185,129,.55)', borderRadius:10 },
            { label:'Peso (kg)', data: weight, backgroundColor:'rgba(245,158,11,.45)', borderRadius:10 }
          ]},
          options: {
            plugins: { legend: { labels: { color: tickColor } } },
            scales: {
              x: { grid: { display:false }, ticks: { color: tickColor } },
              y: { beginAtZero:true, grid: { color: gridColor }, ticks: { color: tickColor } }
            }
          }
        });
      }
    }

      $('#btnAskNotif')?.addEventListener('click', ensureNotifications);
      $('#btnLogout2')?.addEventListener('click', logout);

      $('#btnExport')?.addEventListener('click', () => exportBackup());
      $('#fileImport')?.addEventListener('change', (e) => importBackup(e.target.files?.[0]));

      $('#btnResetData')?.addEventListener('click', async () => {
        const ok = await confirmModal({
          title: 'Resetar dados',
          message: 'Isso apagará todos os dados (tarefas, hábitos, metas, etc.) deste usuário e recriará dados padrão.',
          danger: true,
          confirmText: 'Resetar'
        });
        if (!ok) return;
        state.data = defaultData();
        saveDataFor(state.user.id, state.data);
        toast('Dados resetados.', 'ok');
        render();
      });

      $('#btnDeleteUser')?.addEventListener('click', async () => {
        const ok = await confirmModal({
          title: 'Excluir conta local',
          message: 'Isso removerá seu usuário e dados do navegador. Não há como recuperar sem backup.',
          danger: true,
          confirmText: 'Excluir'
        });
        if (!ok) return;
        // remove data
        storage.del(getUserDataKey(state.user.id));
        // remove user
        const users = getUsers().filter(u => u.id !== state.user.id);
        setUsers(users);
        logout();
      });
    }

    function exportBackup() {
      const payload = {
        app: 'pgp',
        version: 1,
        exportedAt: nowISO(),
        user: { id: state.user.id, email: state.user.email, name: state.user.name },
        data: state.data
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `backup-gestao-pessoal-${state.user.email.replace(/[^a-z0-9]+/gi,'_')}-${fmt.dateISO(new Date())}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
      toast('Backup exportado.', 'ok');
    }

    async function importBackup(file) {
      if (!file) return;
      try {
        const text = await file.text();
        const json = JSON.parse(text);
        if (!json?.data) throw new Error('Arquivo inválido.');
        const ok = await confirmModal({
          title: 'Importar backup',
          message: 'Isso substituirá os dados do usuário atual. Deseja continuar?',
          danger: true,
          confirmText: 'Importar'
        });
        if (!ok) return;
        state.data = json.data;
        saveDataFor(state.user.id, state.data);
        toast('Backup importado com sucesso.', 'ok');
        render();
      } catch (e) {
        toast(e.message || 'Falha ao importar.', 'err');
      }
    }

    // -------------------------
    // Utilities
    // -------------------------
    function escapeHtml(s) {
      return (s ?? '').toString()
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'",'&#39;');
    }
    function escapeAttr(s) { return escapeHtml(s).replaceAll('\n',' '); }

    function stripHtml(html) {
      const d = document.createElement('div');
      d.innerHTML = html || '';
      return (d.textContent || d.innerText || '').trim();
    }

    // -------------------------
    // Boot
    // -------------------------
    (function init() {
      // theme
      setTheme(getTheme());
      render();
    })();
  </script>
</body>
</html>
